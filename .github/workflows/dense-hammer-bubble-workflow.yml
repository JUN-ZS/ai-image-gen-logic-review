name: Dense Hammer Bubble Selection Workflow

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'bubble_break/DENSE_HAMMER_BUBBLE_SELECTION_WORKFLOW.md'
      - 'bubble_break/dense_hammer_bubble_workflow.py'
      - 'bubble_break/stage_d_gates.py'
      - 'bubble_break/autonomous_pipeline.py'
      - 'bubble_break/dual_t_hammer_collision.py'
      - 'bubble_break/test_dual_t_hammer_collision.py'
      - 'bubble_break/raster_bound_collision_audit.py'
      - 'bubble_break/test_raster_bound_collision_audit.py'
      - 'bubble_break/test_dense_hammer_bubble_workflow.py'
      - 'bubble_break/test_autonomous_pipeline.py'
      - '.github/workflows/dense-hammer-bubble-workflow.yml'
  pull_request:
    paths:
      - 'bubble_break/DENSE_HAMMER_BUBBLE_SELECTION_WORKFLOW.md'
      - 'bubble_break/dense_hammer_bubble_workflow.py'
      - 'bubble_break/stage_d_gates.py'
      - 'bubble_break/autonomous_pipeline.py'
      - 'bubble_break/dual_t_hammer_collision.py'
      - 'bubble_break/test_dual_t_hammer_collision.py'
      - 'bubble_break/test_dense_hammer_bubble_workflow.py'
      - 'bubble_break/test_autonomous_pipeline.py'
      - '.github/workflows/dense-hammer-bubble-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planted-double-ended-hammer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow & NumPy for pixel gates
        run: python -m pip install --upgrade pip pillow numpy
      - name: Test planted-head geometry, lateral handle, ratios, pixel gates and autonomous pipeline
        run: |
          python -m unittest bubble_break/test_dense_hammer_bubble_workflow.py -v
          python -m unittest bubble_break/test_autonomous_pipeline.py -v
          python -m unittest bubble_break/test_dual_t_hammer_collision.py -v
          python -m unittest bubble_break/test_raster_bound_collision_audit.py -v
      - name: Compile the corrected dual-T-hammer contact-plane prompt matrix
        run: python -m bubble_break.dual_t_hammer_collision --outdir out/dual_t_hammer_collision --camera-count 12
      - name: Verify physical contact contract, multiple camera variants, and honest not-verified status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('out/dual_t_hammer_collision')
          manifest = json.loads((out / 'DUAL_T_HAMMER_PROMPT_MANIFEST.json').read_text(encoding='utf-8'))
          contract = json.loads((out / 'DUAL_T_HAMMER_COLLISION_CONTRACT.json').read_text(encoding='utf-8'))
          contact = json.loads((out / 'FIRST_CONTACT_camera_matrix.json').read_text(encoding='utf-8'))
          assert contract['tool_a']['tool_id'] == 'HAMMER_A'
          assert contract['tool_b']['tool_id'] == 'HAMMER_B'
          assert contract['allowed_contact_surfaces'] == ['END_FACE_TO_END_FACE']
          assert len(contact) == 12 and len({x['camera_view'] for x in contact}) == 12
          assert manifest['visual_acceptance_status'] == 'NOT_VERIFIED'
          assert manifest['generation_backend_status'] == 'NOT_CONNECTED_BY_THIS_MODULE'
          print('Dual-hammer geometry contract and 12 independent contact-view prompts verified; pixels remain unapproved until evidence/review.')
          PY
      - name: Compile Stage-A planted hammer atlas prompt
        run: python bubble_break/dense_hammer_bubble_workflow.py --outdir out/planted_hammer_atlas
      - name: Compile auto-selected C13 stages B to E (zero-touch)
        run: python bubble_break/dense_hammer_bubble_workflow.py --outdir out/planted_hammer_auto --auto-select --bubble-scale 1.0 --hammer-scale 1.0 --person-to-hammer-scale 1.0
      - name: Run autonomous self-auditing pipeline with fault-injection & auto-rollback verification
        run: python -m bubble_break.autonomous_pipeline --outdir out/autonomous_ci_run --simulate-fault-injection
      - name: Verify planted double-ended topology, autonomous selection gating and self-healing audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          atlas = Path('out/planted_hammer_atlas')
          selected = Path('out/planted_hammer_auto')
          auto_run = Path('out/autonomous_ci_run')
          a = json.loads((atlas / 'candidate_manifest.json').read_text(encoding='utf-8'))
          b = json.loads((selected / 'candidate_manifest.json').read_text(encoding='utf-8'))
          r = json.loads((auto_run / 'AUTONOMOUS_RUN_MANIFEST.json').read_text(encoding='utf-8'))

          assert a['stage_a_candidate_count'] == 24
          assert a['selected_candidate_id'] is None
          assert a['topology']['head'] == 'double-ended cylindrical round head, radial axis'
          assert 'side-middle' in a['topology']['handle']

          assert b['selected_candidate_id'] == 'C13'
          assert b['auto_selection_ranking_top5']
          assert b['scale_changes']['person_to_hammer_scale'] == 1.0
          for name in (
              'stage_b_one_hammer_no_person.md',
              'stage_c_scale_and_add_person.md',
              'stage_d_action_refinement.md',
              'stage_d3_serial_wash_prompts.json',
              'stage_e_glow_bubble_break.md',
          ):
              assert (selected / name).is_file(), name

          assert r['all_stages_passed'] is False
          assert r['synthetic_test_passed'] is True
          assert r['evidence_mode'] == 'SYNTHETIC_TEST_ONLY'
          assert r['status'] == 'SYNTHETIC_TEST_ONLY'
          assert r['selected_candidate_id'] == 'C13'
          assert r['auto_rejections_and_rollbacks'] >= 2
          print('Autonomous C13 selection, 1:1 person:hammer lock, and self-healing pixel audit verified.')
          PY
      - name: Upload formula prompts, manifest, and autonomous audit packet
        uses: actions/upload-artifact@v4
        with:
          name: planted-double-ended-round-hammer-prompt-packet
          path: |
            out/planted_hammer_*/
            out/autonomous_ci_run/
          if-no-files-found: error
