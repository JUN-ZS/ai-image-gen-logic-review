name: Original Sin Bubble-Break tests

on:
  push:
    branches:
      - main
      - feat/original-sin-bubble-break-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python -m unittest discover -s bubble_break -p "test_*.py"
      - name: Generate and validate 1,000 dual-mode records
        shell: bash
        run: |
          python bubble_break/generate.py --count 1000 --seed 20261020 --mode dual --weapon-topology T --format jsonl --out /tmp/wushuang_1000.jsonl
          python - <<'PY'
          import collections, json
          counts = collections.Counter()
          causal = set()
          story_ids = set()
          total = 0
          with open("/tmp/wushuang_1000.jsonl", encoding="utf-8") as handle:
              for line in handle:
                  row = json.loads(line)
                  total += 1
                  story_ids.add(row["story_id"])
                  assert row["weapon_topology"] == "WEAPON_T", row["story_id"]
                  assert row["realization_path"] == "proxy_edit", row["story_id"]
                  counts[row["root_sin"]] += 1
                  causal.add(row["causal_signature"])
                  assert row["audit"]["status"] == "PROMPT_CONTRACT_PASS", row["story_id"]
                  assert row["audit"]["image_realization"] == "NOT_RUN", row["story_id"]
                  assert set(row["prompts"]) == {"heroine", "abstract"}, row["story_id"]
          assert total == 1000, total
          assert len(story_ids) == 1000, len(story_ids)
          assert len(counts) == 20, sorted(counts)
          assert max(counts.values()) - min(counts.values()) <= 1, counts
          assert len(causal) == 20, len(causal)
          print(json.dumps({
              "rows": total, "unique_story_ids": len(story_ids),
              "root_cause_kernels": len(counts), "causal_signatures": len(causal),
              "per_cause_min": min(counts.values()), "per_cause_max": max(counts.values()),
              "audit": "PROMPT_CONTRACT_PASS", "image_realization": "NOT_RUN"
          }, ensure_ascii=False, indent=2))
          PY

      - name: Compile T-topology before/contact/after frame prompts
        run: |
          python bubble_break/frame_pipeline.py --input /tmp/wushuang_1000.jsonl --outdir /tmp/wushuang_frames --limit 3 --weapon-topology T --camera-sweep
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/wushuang_frames")
          batch = json.loads((root / "batch_manifest.json").read_text(encoding="utf-8"))
          assert batch["written_story_packets"] == 3, batch
          assert batch["written_camera_packets"] == 36, batch
          assert len(batch["camera_variants"]) == 12, batch
          assert batch["camera_sweep"] is True, batch
          assert batch["image_realization"] == "NOT_RUN", batch
          assert batch["pixel_audit_status"] == "NOT_RUN", batch
          for item in batch["packets"]:
              folder = Path(item["directory"])
              assert item["prompt_contract_status"] == "PROMPT_CONTRACT_PASS", item
              assert (folder / "H0_pre_impact.txt").exists()
              assert (folder / "H2_first_contact_anchor.txt").exists()
              assert (folder / "H3_post_impact.txt").exists()
              assert (folder / "H0_pre_impact_geometry.svg").exists()
              assert (folder / "H2_first_contact_anchor_geometry.svg").exists()
              assert (folder / "H3_post_impact_geometry.svg").exists()
              layout = json.loads((folder / "layout.json").read_text(encoding="utf-8"))
              assert layout["projection_lock"]["P_six_oclock"] == {"x": 1090, "y": 610}
              assert layout["projection_lock"]["frames"]["H0"]["gap_px"] == 50
              assert layout["projection_lock"]["frames"]["H2"]["gap_px"] == 0
              assert layout["projection_lock"]["frames"]["H3"]["gap_px"] == -15
              manifest = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["canonical_weapon"] == "WEAPON_T"
              assert manifest["weapon_topology"] == "T"
              assert "horizontal crossbar" in manifest["weapon_shape_contract"]
              assert manifest["workflow"]["realization_stage_gate"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED"
              assert manifest["workflow"]["required_stage_a_artifact"] == "A_T_weapon_master.png"
              assert (folder / "stage_gate.json").exists()
              gate = json.loads((folder / "stage_gate.json").read_text(encoding="utf-8"))
              assert gate["status"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED"
              assert manifest["pixel_audit_status"] == "NOT_RUN"
          print(json.dumps({"frame_packets": 3, "frames_per_packet": 3,
                            "weapon_topology": "T", "prompt_contract": "PASS", "pixel_audit": "NOT_RUN"},
                           ensure_ascii=False, indent=2))
          PY

      - name: Compile 48-view T-to-T terminal-end-face collision matrix with balanced handle poses
        run: |
          python bubble_break/t_contact_matrix.py --outdir /tmp/wushuang_T_contact_matrix
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/wushuang_T_contact_matrix")
          manifest = json.loads((root / "contact_matrix_manifest.json").read_text(encoding="utf-8"))
          rows = [json.loads(line) for line in (root / "t_contact_matrix.jsonl").read_text(encoding="utf-8").splitlines()]
          assert manifest["camera_view_count"] == 12, manifest
          assert manifest["collision_axis_count"] == 4, manifest
          assert manifest["variant_count"] == 48, manifest
          assert manifest["single_image_prompt_count"] == 144, manifest
          assert manifest["required_H2_contact_proof_images"] == 48, manifest
          assert len(rows) == 144, len(rows)
          assert sum(row["state"] == "H2" for row in rows) == 48
          assert all("TERMINAL_END_STRIKING_FACE" in row["expected_contact_contract"]["active_surface_A"] for row in rows)
          assert all(row["image_realization"] == "NOT_RUN" and row["pixel_audit"] == "NOT_RUN" for row in rows)
          print(json.dumps({"camera_views": 12, "collision_axes": 4, "variants": 48,
                            "single_image_prompts": 144, "required_H2_images": 48,
                            "actual_images": "NOT_RUN"}, ensure_ascii=False, indent=2))
          PY

          python bubble_break/t_contact_matrix.py --validate-dir /tmp/wushuang_T_contact_matrix
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/wushuang_T_contact_matrix")
          report = json.loads((root / "contact_matrix_audit_report.json").read_text(encoding="utf-8"))
          assert report["overall_status"] == "BLOCKED", report
          assert report["variant_count"] == 48, report
          assert report["reviewed_pass_count"] == 0, report
          assert report["blocked_count"] == 48, report
          assert report["automatic_pixel_claims"] is False, report
          print(json.dumps({"empty_contact_matrix": "BLOCKED_AS_REQUIRED",
                            "reviewed_pass": 0, "blocked": 48,
                            "automatic_pixel_claims": False}, ensure_ascii=False, indent=2))
          PY

      - name: Build T weapon master plus end-face matrix gate
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path("/tmp/wushuang_frames")
          batch = json.loads((root / "batch_manifest.json").read_text(encoding="utf-8"))
          layout = Path(batch["packets"][0]["directory"]) / "layout.json"
          subprocess.run([sys.executable, "bubble_break/proxy_edit_pipeline.py",
                          "--input-layout", str(layout), "--outdir", "/tmp/wushuang_proxy_edit", "--final-weapon", "T"],
                         check=True)
          out = Path("/tmp/wushuang_proxy_edit")
          plan = json.loads((out / "edit_plan.json").read_text(encoding="utf-8"))
          assert plan["method"] == "T_MASTER_THEN_T_END_FACE_CONTACT_MATRIX_THEN_STORY_SCENE_GENERATION", plan
          assert plan["status"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED", plan
          assert plan["vector_proxy_status"] == "T_WEAPON_MASTER_SHAPE_PROXY_VALID", plan
          assert plan["stage_gate_status"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED", plan
          assert plan["pixel_truth"]["contact_matrix_images"] == "NOT_RUN", plan
          assert plan["required_artifacts"]["contact_matrix_h2_image_count"] == 48, plan
          assert plan["selected_edit_prompt"] == "generate_scene_with_T_master.txt", plan
          assert plan["pixel_truth"]["edited_images"] == "NOT_RUN"
          for name in ("00_T_weapon_master_geometry.svg", "00_generate_T_weapon_master.txt",
                       "01_T_terminal_end_face_contact_schematic.svg", "02_target_bubble_edit_mask.svg",
                       "03_attacker_T_protect_mask.svg", "05_T_silhouette_reference.svg",
                       "generate_scene_with_T_master.txt", "A_T_weapon_master_review.template.json", "stage_gate.json"):
              assert (out / name).exists(), name
          gate = json.loads((out / "stage_gate.json").read_text(encoding="utf-8"))
          assert gate["do_not_mark_pass_from_prompt_or_svg_alone"] is True
          print(json.dumps({"single_T_weapon_master_proxy": "PASS", "required_first_stage": "T_WEAPON_MASTER_AND_CONTACT_MATRIX",
                            "downstream_gate": "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED",
                            "external_edit_pixels": "NOT_RUN"}, ensure_ascii=False, indent=2))
          PY

      - name: Bridge bulk stories to per-kernel T realization packets
        run: |
          python bubble_break/realize_batch.py --input /tmp/wushuang_1000.jsonl --outdir /tmp/wushuang_realize_T --per-kernel 1 --limit 20 --final-weapon T
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/wushuang_realize_T")
          result = json.loads((root / "realize_batch_manifest.json").read_text(encoding="utf-8"))
          assert result["selected_stories"] == 20, result
          assert result["distinct_causal_kernels"] == 20, result
          assert result["final_weapon"] == "T", result
          assert result["stage_gate_status"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED", result
          assert result["required_first_stage"] == "A_T_WEAPON_MASTER_AND_CONTACT_MATRIX", result
          shared = Path(result["shared_weapon_master_directory"])
          assert (shared / "00_generate_T_weapon_master.txt").exists()
          assert (shared / "A_T_weapon_master_review.template.json").exists()
          assert (shared / "05_T_silhouette_reference.svg").exists()
          assert (shared / "stage_gate.json").exists()
          assert result["image_realization"] == "NOT_RUN", result
          assert result["pixel_audit_status"] == "NOT_RUN", result
          assert result["contact_matrix_audit_status"] == "BLOCKED", result
          assert result["master_review_status"] == "BLOCKED", result
          assert result["contact_matrix_variants"] == 48, result
          assert result["contact_matrix_prompt_count"] == 144, result
          assert result["scene_camera_variants_per_story"] == 12, result
          assert result["scene_frame_prompt_count"] == 720, result
          matrix_path = Path(result["contact_matrix_manifest"])
          assert matrix_path.exists()
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          assert matrix["variant_count"] == 48, matrix
          assert matrix["single_image_prompt_count"] == 144, matrix
          assert matrix["required_H2_contact_proof_images"] == 48, matrix
          for item in result["packages"]:
              proxy = Path(item["proxy_directory"])
              plan = json.loads((proxy / "edit_plan.json").read_text(encoding="utf-8"))
              assert plan["final_weapon"] == "T", plan
              assert plan["method"] == "T_MASTER_THEN_T_END_FACE_CONTACT_MATRIX_THEN_STORY_SCENE_GENERATION", plan
              assert plan["status"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED", plan
              assert plan["terminal_face_gap_px"] is None, plan
              assert plan["pixel_truth"]["contact_matrix_images"] == "NOT_RUN", plan
              assert plan["selected_edit_prompt"] == "generate_scene_with_T_master.txt", plan
              assert plan["stage_gate_status"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED", plan
              assert plan["contact_matrix_audit_status"] == "BLOCKED", plan
              assert plan["master_review_status"] == "BLOCKED", plan
              assert item["stage_gate_status"] == "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED", item
              assert item["required_first_stage_artifact"] == str(shared / "A_T_weapon_master.png"), item
              assert item["shared_weapon_master_directory"] == str(shared), item
              assert not (proxy / "00_generate_T_weapon_master.txt").exists()
              assert not (proxy / "05_T_silhouette_reference.svg").exists()
              assert plan["master_scope"] == "SHARED_ACROSS_BATCH", plan
              assert item["selected_edit_prompt"] == str(proxy / "generate_scene_with_T_master.txt"), item
              assert item["camera_packet_count"] == 12, item
              assert item["frame_prompt_count"] == 36, item
              assert len(item["frame_directories"]) == 12, item
              assert item["contact_matrix_manifest"] == str(matrix_path), item
              assert not (proxy / "00_T_weapon_master_geometry.svg").exists()
              assert not (proxy / "00_generate_T_weapon_master.txt").exists()
              assert (proxy / "stage_gate.json").exists()
              assert (proxy / "generate_scene_with_T_master.txt").exists()
              assert (proxy / "04_T_final_weapon_preview.svg").exists()
          print(json.dumps({"selected_stories": 20, "distinct_kernels": 20,
                            "final_weapon": "T", "contact_matrix_variants": 48,
                            "contact_matrix_prompts": 144, "scene_camera_variants_per_story": 12,
                            "scene_frame_prompts": 720, "vector_proxy": "PASS",
                            "real_image_stage_gate": "BLOCKED_UNTIL_T_CONTACT_MATRIX_APPROVED",
                            "contact_matrix_images": "NOT_RUN", "edited_pixels": "NOT_RUN"}, ensure_ascii=False, indent=2))
          PY

      - name: Compile and validate CYLINDER_CROSS end-cap contact matrix
        run: |
          python bubble_break/cylinder_cross_contact_matrix.py --outdir /tmp/wushuang_CYLINDER_CROSS_contact_matrix
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/wushuang_CYLINDER_CROSS_contact_matrix")
          manifest = json.loads((root / "contact_matrix_manifest.json").read_text(encoding="utf-8"))
          rows = [json.loads(line) for line in (root / "cylinder_cross_contact_matrix.jsonl").read_text(encoding="utf-8").splitlines()]
          assert manifest["topology_contract"] == "CYLINDER_CROSS_FLAT_CIRCULAR_END_CAP_TO_END_CAP", manifest
          assert manifest["variant_count"] == 48, manifest
          assert manifest["single_image_prompt_count"] == 144, manifest
          assert manifest["required_H2_contact_proof_images"] == 48, manifest
          assert len(rows) == 144, len(rows)
          assert all(row["expected_contact_contract"]["active_surface_A"] == "FLAT_CIRCULAR_END_CAP" for row in rows), "wrong active surface A"
          assert all(row["expected_contact_contract"]["active_surface_B"] == "FLAT_CIRCULAR_END_CAP" for row in rows), "wrong active surface B"
          assert all("CURVED_BARREL" in row["expected_contact_contract"]["forbidden_first_contacts"] for row in rows), "barrel-first not prohibited"
          assert not any("Keep both T heads" in row["prompt"] for row in rows), "T-era wording remains in prompts"
          print(json.dumps({"topology":"CYLINDER_CROSS","variants":48,"single_image_prompts":144,
                            "active_surfaces":"FLAT_CIRCULAR_END_CAP x 2","generation":"NOT_RUN"}, ensure_ascii=False, indent=2))
          PY
          python bubble_break/cylinder_cross_contact_matrix.py --validate-dir /tmp/wushuang_CYLINDER_CROSS_contact_matrix
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/wushuang_CYLINDER_CROSS_contact_matrix/contact_matrix_audit_report.json").read_text(encoding="utf-8"))
          assert report["overall_status"] == "BLOCKED", report
          assert report["variant_count"] == 48, report
          assert report["blocked_count"] == 48, report
          assert report["reviewed_pass_count"] == 0, report
          print(json.dumps({"empty_real_H2_images":"BLOCKED_AS_REQUIRED","blocked_variants":48,"pixel_audit":"NOT_RUN"}, ensure_ascii=False, indent=2))
          PY

      - name: Bridge stories through independent CYLINDER_CROSS gate
        run: |
          python bubble_break/realize_batch.py --input /tmp/wushuang_1000.jsonl --outdir /tmp/wushuang_realize_CYLINDER_CROSS --per-kernel 1 --limit 2 --final-weapon CYLINDER_CROSS
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/wushuang_realize_CYLINDER_CROSS")
          result = json.loads((root / "realize_batch_manifest.json").read_text(encoding="utf-8"))
          assert result["selected_stories"] == 2, result
          assert result["final_weapon"] == "CYLINDER_CROSS", result
          assert result["stage_gate_status"] == "BLOCKED_UNTIL_CYLINDER_CROSS_CONTACT_MATRIX_APPROVED", result
          assert result["required_first_stage"] == "A_CYLINDER_CROSS_END_CAP_CONTACT_MATRIX", result
          assert result["contact_matrix_variants"] == 48, result
          assert result["contact_matrix_prompt_count"] == 144, result
          assert result["contact_matrix_audit_status"] == "BLOCKED", result
          assert result["image_realization"] == "NOT_RUN", result
          assert result["pixel_audit_status"] == "NOT_RUN", result
          matrix = json.loads(Path(result["contact_matrix_manifest"]).read_text(encoding="utf-8"))
          assert matrix["topology_contract"] == "CYLINDER_CROSS_FLAT_CIRCULAR_END_CAP_TO_END_CAP", matrix
          for item in result["packages"]:
              plan = json.loads((Path(item["proxy_directory"]) / "edit_plan.json").read_text(encoding="utf-8"))
              assert plan["final_weapon"] == "CYLINDER_CROSS", plan
              assert plan["status"] == "BLOCKED_UNTIL_CYLINDER_CROSS_CONTACT_MATRIX_APPROVED", plan
              assert item["terminal_face_gap_px"] is None, item
              assert plan["terminal_face_gap_px"] is None, plan
              assert plan["pixel_truth"]["contact_matrix_images"] == "NOT_RUN", plan
              assert Path(item["selected_edit_prompt"]).exists(), item
              assert (Path(item["proxy_directory"]) / "stage_gate.json").exists()
          print(json.dumps({"stories":2,"fresh_contact_variants":48,"prompts":144,
                            "gate":"BLOCKED_UNTIL_CYLINDER_CROSS_CONTACT_MATRIX_APPROVED",
                            "old_T_evidence_transferred":False,"image_realization":"NOT_RUN"}, ensure_ascii=False, indent=2))
          PY

      - name: Compile dense single-image CYLINDER_CROSS atlas prompt
        run: |
          python bubble_break/cylinder_cross_dense_atlas.py --outdir /tmp/cylinder_cross_dense_atlas
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/cylinder_cross_dense_atlas")
          prompt_path = root / "cylinder_cross_dense_atlas_prompt.txt"
          manifest = json.loads((root / "cylinder_cross_dense_atlas_manifest.json").read_text(encoding="utf-8"))
          prompt = prompt_path.read_text(encoding="utf-8").rstrip()
          assert manifest["artifact_type"] == "SINGLE_IMAGE_DENSE_CANDIDATE_ATLAS", manifest
          assert manifest["topology"] == "CYLINDER_CROSS", manifest
          assert manifest["intended_local_collision_count"] == 48, manifest
          assert manifest["intended_hammer_count"] == 96, manifest
          assert len(manifest["instances"]) == 48, manifest
          assert len({item["instance_id"] for item in manifest["instances"]}) == 48
          assert hashlib.sha256(prompt.encode("utf-8")).hexdigest() == manifest["prompt_sha256"], "prompt hash mismatch"
          for phrase in ("flat circular end caps", "coincident cap planes", "opposite outward normals",
                         "curved cylindrical barrel walls", "no bending", "for later visual scanning"):
              assert phrase in prompt.lower(), phrase
          assert manifest["generation_status"] == "IMAGE_REALIZATION_NOT_RUN", manifest
          assert manifest["pixel_audit_status"] == "PIXEL_AUDIT_NOT_RUN", manifest
          print(json.dumps({"atlas":"PROMPT_COMPILED","one_image_prompt":True,"intended_pairs":48,
                            "actual_image_generation":"NOT_RUN","pixel_audit":"NOT_RUN"}, ensure_ascii=False, indent=2))
          PY

      - name: Upload T contact matrix prompts and 12-camera scene prompt sweeps
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cylinder-cross-dense-atlas-and-contact-matrix-review-bundle
          path: |
            /tmp/wushuang_T_contact_matrix
            /tmp/wushuang_frames
            /tmp/wushuang_realize_T
            /tmp/wushuang_CYLINDER_CROSS_contact_matrix
            /tmp/wushuang_realize_CYLINDER_CROSS
            /tmp/cylinder_cross_dense_atlas
          if-no-files-found: warn
          retention-days: 7
