name: Original Sin Bubble-Break tests

on:
  push:
    branches:
      - feat/original-sin-bubble-break-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python -m unittest discover -s bubble_break -p "test_*.py"
      - name: Generate and validate 1,000 dual-mode records
        shell: bash
        run: |
          python bubble_break/generate.py --count 1000 --seed 20261020 --mode dual --format jsonl --out /tmp/wushuang_1000.jsonl
          python - <<'PY'
          import collections, json
          counts = collections.Counter()
          causal = set()
          story_ids = set()
          total = 0
          with open("/tmp/wushuang_1000.jsonl", encoding="utf-8") as handle:
              for line in handle:
                  row = json.loads(line)
                  total += 1
                  story_ids.add(row["story_id"])
                  counts[row["root_sin"]] += 1
                  causal.add(row["causal_signature"])
                  assert row["audit"]["status"] == "PROMPT_CONTRACT_PASS", row["story_id"]
                  assert row["audit"]["image_realization"] == "NOT_RUN", row["story_id"]
                  assert set(row["prompts"]) == {"heroine", "abstract"}, row["story_id"]
          assert total == 1000, total
          assert len(story_ids) == 1000, len(story_ids)
          assert len(counts) == 20, sorted(counts)
          assert max(counts.values()) - min(counts.values()) <= 1, counts
          assert len(causal) == 20, len(causal)
          print(json.dumps({
              "rows": total, "unique_story_ids": len(story_ids),
              "root_cause_kernels": len(counts), "causal_signatures": len(causal),
              "per_cause_min": min(counts.values()), "per_cause_max": max(counts.values()),
              "audit": "PROMPT_CONTRACT_PASS", "image_realization": "NOT_RUN"
          }, ensure_ascii=False, indent=2))
          PY

      - name: Compile separate before/contact/after frame prompts
        run: |
          python bubble_break/frame_pipeline.py --input /tmp/wushuang_1000.jsonl --outdir /tmp/wushuang_frames --limit 3
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/wushuang_frames")
          batch = json.loads((root / "batch_manifest.json").read_text(encoding="utf-8"))
          assert batch["written_story_packets"] == 3, batch
          assert batch["image_realization"] == "NOT_RUN", batch
          assert batch["pixel_audit_status"] == "NOT_RUN", batch
          for item in batch["packets"]:
              folder = Path(item["directory"])
              assert item["prompt_contract_status"] == "PROMPT_CONTRACT_PASS", item
              assert (folder / "H0_pre_impact.txt").exists()
              assert (folder / "H2_first_contact_anchor.txt").exists()
              assert (folder / "H3_post_impact.txt").exists()
              manifest = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["canonical_weapon"] == "WEAPON_C_RADIAL_SPHERE"
              assert manifest["pixel_audit_status"] == "NOT_RUN"
          print(json.dumps({"frame_packets": 3, "frames_per_packet": 3,
                            "prompt_contract": "PASS", "pixel_audit": "NOT_RUN"},
                           ensure_ascii=False, indent=2))
          PY
