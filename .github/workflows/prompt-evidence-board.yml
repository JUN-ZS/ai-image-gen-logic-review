name: Prompt Evidence Board and Trial Planner

on:
  push:
    branches: ['docs/**', 'feat/**']
    paths:
      - 'bubble_break/prompt_evidence_board.py'
      - 'bubble_break/prompt_attempt_packet.py'
      - 'bubble_break/prompt_failure_diagnosis.py'
      - 'bubble_break/prompt_trial_planner.py'
      - 'bubble_break/test_prompt_trial_planner.py'
      - 'bubble_break/boundary_pedestrian_try_art.py'
      - 'bubble_break/test_boundary_pedestrian_try_art.py'
      - 'bubble_break/boundary_pedestrian_loop_planner.py'
      - 'bubble_break/test_boundary_pedestrian_loop_planner.py'
      - 'bubble_break/boundary_pedestrian_product_matrix.py'
      - 'bubble_break/boundary_pedestrian_frame_triad.py'
      - 'bubble_break/test_boundary_pedestrian_frame_triad.py'
      - 'examples/boundary_pedestrian_frame_triad.example.json'
      - 'bubble_break/test_boundary_pedestrian_product_matrix.py'
      - 'bubble_break/boundary_pedestrian_try_art.py'
      - 'bubble_break/test_boundary_pedestrian_try_art.py'
      - 'bubble_break/boundary_pedestrian_loop_planner.py'
      - 'bubble_break/test_boundary_pedestrian_loop_planner.py'
      - 'bubble_break/boundary_pedestrian_product_matrix.py'
      - 'bubble_break/test_boundary_pedestrian_product_matrix.py'
      - 'bubble_break/boundary_pedestrian_frame_triad.py'
      - 'bubble_break/test_boundary_pedestrian_frame_triad.py'
      - 'examples/boundary_pedestrian_frame_triad.example.json'
      - 'bubble_break/test_prompt_evidence_board.py'
      - 'bubble_break/test_prompt_attempt_packet.py'
      - 'bubble_break/test_prompt_failure_diagnosis.py'
      - 'schemas/prompt_attempt_manifest.schema.json'
      - 'examples/prompt_attempt_manifest.example.json'
      - 'examples/prompt_matrix_minimal.example.json'
      - 'docs/PROMPT_*'
      - 'docs/boundary_pedestrian/**'
      - '.github/workflows/prompt-evidence-board.yml'
  pull_request:
    paths:
      - 'bubble_break/prompt_evidence_board.py'
      - 'bubble_break/prompt_attempt_packet.py'
      - 'bubble_break/prompt_failure_diagnosis.py'
      - 'bubble_break/prompt_trial_planner.py'
      - 'bubble_break/test_prompt_trial_planner.py'
      - 'bubble_break/boundary_pedestrian_try_art.py'
      - 'bubble_break/test_boundary_pedestrian_try_art.py'
      - 'bubble_break/boundary_pedestrian_loop_planner.py'
      - 'bubble_break/test_boundary_pedestrian_loop_planner.py'
      - 'bubble_break/test_prompt_evidence_board.py'
      - 'bubble_break/test_prompt_failure_diagnosis.py'
      - 'bubble_break/test_prompt_attempt_packet.py'
      - 'schemas/prompt_attempt_manifest.schema.json'
      - 'examples/prompt_attempt_manifest.example.json'
      - 'examples/prompt_matrix_minimal.example.json'
      - 'docs/PROMPT_*'
      - 'docs/boundary_pedestrian/**'
      - '.github/workflows/prompt-evidence-board.yml'
  workflow_dispatch:

concurrency:
  group: prompt-evidence-board-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  traceability-and-audit-honesty:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the exact local diagnosis module is imported
        run: |
          python - <<'PY'
          import hashlib
          import inspect
          from pathlib import Path
          import bubble_break
          import bubble_break.prompt_failure_diagnosis as module
          expected = (Path.cwd() / 'bubble_break' / 'prompt_failure_diagnosis.py').resolve()
          actual = Path(module.__file__).resolve()
          source = Path(actual).read_text(encoding='utf-8')
          print(f'bubble_break package: {bubble_break.__file__}')
          print(f'diagnosis module: {actual}')
          print(f'diagnosis source SHA-256: {hashlib.sha256(source.encode("utf-8")).hexdigest()}')
          print(f'numeric gap repair branch: {"by exactly {gap:g} units" in source}')
          print(f'numeric followthrough repair branch: {"The raster-bound review measured H3 advance=" in source}')
          assert actual == expected, 'Python imported diagnosis code from outside the checkout'
          assert 'by exactly {gap:g} units' in source
          assert 'The raster-bound review measured H3 advance=' in source
          PY
      - name: Run evidence-board, prompt-packet, diagnosis, and trial-planner tests
        run: |
          python -m unittest bubble_break/test_prompt_evidence_board.py -v
          python -m unittest bubble_break/test_prompt_attempt_packet.py -v
          python -m unittest bubble_break/test_prompt_failure_diagnosis.py -v
          python -m unittest bubble_break/test_prompt_trial_planner.py -v
          python -m unittest bubble_break/test_boundary_pedestrian_try_art.py -v
          python -m unittest bubble_break/test_boundary_pedestrian_frame_triad.py -v
          python -m unittest bubble_break/test_boundary_pedestrian_loop_planner.py -v
          python -m unittest bubble_break/test_boundary_pedestrian_product_matrix.py -v
      - name: Render an in-art Boundary Walker TRY label (no media generation claim)
        run: |
          python bubble_break/boundary_pedestrian_try_art.py \
            --image docs/boundary_pedestrian/i20/act1_draw_boundary.jpg \
            --out out/prompt_evidence_board/boundary_pedestrian/loop001_try0001.svg \
            --loop-id 001 \
            --try-id 0001 \
            --act-id 1 \
            --method-id SHOT.WIDE \
            --method-label "ACT1 / WIDE BOUNDARY REVEAL" \
            --series-id S01-RAIN-TOKYO \
            --world-label "雨夜東京 / RAINY TOKYO" \
            --geometry-family NONE \
            --contact-method SOFT-NO-IMPACT \
            --camera-id CAM01-ULTRA-WIDE \
            --pose-id P01-BORDER-WALK \
            --prompt-id I-20 \
            --style-id S01 \
            --panel-side right \
            --note "本輪試法：極廣角畫界；無硬接觸" \
            --typography-variant before \
            --status IMAGE_GENERATED \
            --ass-out out/prompt_evidence_board/boundary_pedestrian/loop001_try0001.ass \
            --duration-seconds 6
          python bubble_break/boundary_pedestrian_try_art.py \
            --image docs/boundary_pedestrian/i20/act1_draw_boundary.jpg \
            --out out/prompt_evidence_board/boundary_pedestrian/loop001_try0001_after.svg \
            --label-manifest out/prompt_evidence_board/boundary_pedestrian/loop001_try0001.manifest.json \
            --act-id 1 \
            --typography-variant after \
            --ass-out out/prompt_evidence_board/boundary_pedestrian/loop001_try0001_after.ass \
            --duration-seconds 6
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('out/prompt_evidence_board/boundary_pedestrian')
          svg_path = root / 'loop001_try0001.svg'
          svg_bytes = svg_path.read_bytes()
          svg = svg_bytes.decode('utf-8')
          manifest = json.loads((root / 'loop001_try0001.manifest.json').read_text(encoding='utf-8'))
          source_bytes = Path('docs/boundary_pedestrian/i20/act1_draw_boundary.jpg').read_bytes()
          assert manifest['source_sha256'] == hashlib.sha256(source_bytes).hexdigest()
          assert manifest['artwork_sha256'] == hashlib.sha256(svg_bytes).hexdigest()
          after_path = root / 'loop001_try0001_after.svg'
          after_bytes = after_path.read_bytes()
          after_svg = after_bytes.decode('utf-8')
          after_manifest = json.loads((root / 'loop001_try0001_after.manifest.json').read_text(encoding='utf-8'))
          ass = (root / 'loop001_try0001.ass').read_text(encoding='utf-8')
          ass_after = (root / 'loop001_try0001_after.ass').read_text(encoding='utf-8')
          assert 'THE BOUNDARY WALKER' in svg and 'TRY 0001' in svg and 'SHOT.WIDE' in svg
          assert manifest['pixel_audit_status'] == 'NOT_RUN'
          assert manifest['visual_acceptance_status'] == 'NOT_VERIFIED'
          assert manifest['poster_panel_area_fraction'] > (1 / 3)
          assert manifest['source_sha256'] and len(manifest['source_sha256']) == 64
          assert manifest['artwork_sha256'] == hashlib.sha256(svg_bytes).hexdigest()
          assert manifest['artwork_sha256'] and len(manifest['artwork_sha256']) == 64
          assert manifest['series_id'] == 'S01-RAIN-TOKYO'
          assert manifest['typography_variant'] == 'before'
          assert after_manifest['typography_variant'] == 'after'
          assert after_manifest['source_sha256'] == manifest['source_sha256']
          assert after_manifest['artwork_sha256'] == hashlib.sha256(after_bytes).hexdigest()
          assert after_manifest['text_content_sha256'] == manifest['text_content_sha256']
          assert svg != after_svg
          assert ass == ass_after
          assert 'SHOT.WIDE' in ass and 'TRY 0001' in ass
          print('PRE/POST poster treatments differ visually; canonical text hash and video ASS remain identical; source/artwork SHA-256 recorded.')
          PY
      - name: Compile the H2 master-first frame triad (PRE/POST remain gated)
        run: |
          python bubble_break/boundary_pedestrian_frame_triad.py \
            --package examples/boundary_pedestrian_frame_triad.example.json \
            --mid-image docs/boundary_pedestrian/hard_samples/p4_t_h2/AX0_X_RIGHT.jpg \
            --outdir out/prompt_evidence_board/boundary_pedestrian/frame_triad
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('out/prompt_evidence_board/boundary_pedestrian/frame_triad')
          plan = json.loads((root / 'frame_triad.json').read_text(encoding='utf-8'))
          assert plan['status'] == 'HOLD_MID_CORRECTION_AND_REVIEW'
          assert plan['mid_master_sha256'] == '7d0d095f95fbc24129bab11f659645b712ba56727ef737765c4320dec2b4b641'
          assert plan['mid_geometry_review_accepted'] is False
          assert any('receipt not supplied' in reason.lower() for reason in plan['blocked_reasons'])
          assert plan['frames'][0]['status'] == 'MID_CORRECTION_REQUIRED'
          assert plan['frames'][1]['status'] == 'BLOCKED_UNTIL_MID_H2_ACCEPTED'
          assert plan['frames'][2]['status'] == 'BLOCKED_UNTIL_MID_H2_ACCEPTED'
          assert plan['frames'][1]['parent_frame_id'] == plan['frames'][2]['parent_frame_id'] == 'MID_H2'
          assert plan['frame_typography']['pre_frame_variant'] == 'before'
          assert plan['frame_typography']['post_frame_variant'] == 'after'
          assert plan['frame_typography']['video_variant'] == 'video-lock'
          assert plan['frame_typography']['same_words_across_all_frames_and_video'] is True
          assert plan['frame_typography']['pre_and_post_visual_treatment_differs'] is True
          print('H2 master must be corrected and SHA-reviewed before either derivative can be produced.')
          PY
      - name: Compile every legal variant into a six-act loop prompt queue
        run: |
          python bubble_break/boundary_pedestrian_loop_planner.py \
            --variants-csv docs/boundary_pedestrian/variants/VARIANT_IDS_FULL.csv \
            --outdir out/prompt_evidence_board/boundary_pedestrian/loop_prompts
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path('out/prompt_evidence_board/boundary_pedestrian/loop_prompts')
          summary = json.loads((root / 'loop_plan_summary.json').read_text(encoding='utf-8'))
          catalog = json.loads(Path('docs/boundary_pedestrian/variants/VARIANT_IDS_FULL_SUMMARY.json').read_text(encoding='utf-8'))
          packets = [json.loads(line) for line in (root / 'loop_prompt_packets.jsonl').read_text(encoding='utf-8').splitlines()]
          with (root / 'loop_index.csv').open(encoding='utf-8', newline='') as handle:
              index = list(csv.DictReader(handle))
          assert summary['source_total_variants'] == catalog['total_ids']
          assert summary['compiled_variant_count'] == catalog['total_ids']
          assert summary['full_sweep_compiled'] is True
          assert summary['unique_variant_ids'] == catalog['total_ids']
          assert summary['all_selected_variant_ids_once'] is True
          assert summary['external_generation_called'] is False
          assert summary['image_realization'] == 'NOT_RUN'
          assert summary['pixel_audit_status'] == 'NOT_RUN'
          assert summary['visual_acceptance_status'] == 'NOT_VERIFIED'
          assert len(packets) == len(index) == catalog['total_ids']
          assert len({p['variant_id'] for p in packets}) == catalog['total_ids']
          assert all(len(p['acts']) == 6 for p in packets)
          assert all(sum(a['is_primary_try'] for a in p['acts']) == 1 for p in packets)
          assert all(p['status'] == 'PROMPT_READY' for p in packets)
          hard = [p for p in packets if p['lane'] == 'HARD']
          assert hard and all(p['primary_act'] == '3' for p in hard)
          first_buckets = {p['catalog_row']['count_bucket'] for p in packets[:20]}
          assert len(first_buckets) >= 5, f'initial trials do not diversify method buckets: {first_buckets}'
          print(f"Compiled {len(packets)} catalog variants into {len(packets) * 6} act prompts; no media generation or audit pass claimed.")
          PY
      - name: Compile the true legal four-axis Boundary Walker cross-product
        run: |
          python bubble_break/boundary_pedestrian_product_matrix.py \
            --variants-csv docs/boundary_pedestrian/variants/VARIANT_IDS_FULL.csv \
            --catalog-doc docs/IMAGE_VIDEO_PROMPT_CATALOG.md \
            --outdir out/prompt_evidence_board/boundary_pedestrian/product_matrix
          python - <<'PY'
          import csv
          import gzip
          import json
          from pathlib import Path

          root = Path('out/prompt_evidence_board/boundary_pedestrian/product_matrix')
          s = json.loads((root / 'boundary_walker_product_summary.json').read_text(encoding='utf-8'))
          assert s['image_geometry_camera_style_pose_configs'] == 18576
          assert s['compatible_geometry_camera_style_pose_video_configs'] == 64944
          assert s['pose_factor'] == 4
          assert s['story_series_factor_total'] == 18
          assert s['story_series_per_style'] == {'S01': 6, 'S02': 6, 'S03': 6}
          assert s['full_cross_product_combinations'] == 389664
          assert s['compiled_combinations'] == 389664 and s['full_product_compiled'] is True
          assert s['unique_combination_ids'] == 389664 and s['all_combination_ids_unique'] is True
          assert s['compiled_base_image_and_video_prompt_count'] == 4675968
          assert s['video_keyframe_prompts_compiled'] == 276480
          assert s['mv_shot_pairs_compiled'] == 3195072
          assert s['mv_shot_image_and_video_prompt_count'] == 6390144
          assert s['external_generation_called'] is False
          assert s['pixel_audit_status'] == 'NOT_RUN'
          assert s['visual_acceptance_status'] == 'NOT_VERIFIED'
          with (root / 'boundary_walker_product_index.csv').open(encoding='utf-8', newline='') as handle:
              index_count = sum(1 for _ in csv.DictReader(handle))
          assert index_count == 389664, index_count
          package_count = 0
          video_methods = {}
          id_seen = set()
          series_seen = set()
          world_seen = set()
          pose_seen = set()
          style_series_seen = {}
          with gzip.open(root / 'boundary_walker_full_product.jsonl.gz', 'rt', encoding='utf-8') as handle:
              for line in handle:
                  rec = json.loads(line)
                  package_count += 1
                  assert rec['combination_id'] not in id_seen
                  id_seen.add(rec['combination_id'])
                  assert len(rec['acts']) == 6
                  assert sum(a['primary_try'] for a in rec['acts']) == 1
                  assert all(a['image_prompt'].startswith('Create one single') for a in rec['acts'])
                  assert all('independently reviewable' in a['video_prompt'] for a in rec['acts'])
                  assert rec['status'] == 'PROMPT_READY'
                  assert rec['image_realization'] == 'NOT_RUN'
                  assert rec['video_realization'] == 'NOT_RUN'
                  assert rec['pixel_audit_status'] == 'NOT_RUN'
                  assert rec['visual_acceptance_status'] == 'NOT_VERIFIED'
                  series_id = rec['axes']['series_id']
                  series = s['story_series'][series_id]
                  label = rec['art_label_spec']
                  assert label['loop_id'] == rec['loop_id'] and label['try_id'] == rec['try_id']
                  assert label['series_id'] == series_id
                  assert label['world_label'] == series['world_name']
                  assert label['method_id'] == 'GEO.' + rec['axes']['geo_family']
                  assert label['geometry_family'] == rec['axes']['geo_family']
                  assert label['contact_method'] == rec['axes']['contact']
                  assert label['pose_id'] == rec['axes']['pose_id']
                  assert label['style_id'] == rec['axes']['style']
                  assert set(label['acts']) == {'1', '2', '3', '4', '5', '6'}
                  assert label['acts']['3']['prompt_id'] == rec['acts'][2]['image_prompt_id']
                  assert rec['axes']['style'] == series['style_id']
                  assert rec['axes']['pose_id'] in {'P01', 'P02', 'P03', 'P04'}
                  assert series_id in rec['acts'][0]['image_prompt']
                  assert len({a['image_prompt'] for a in rec['acts']}) == 6
                  assert len({a['video_prompt'] for a in rec['acts']}) == 6
                  series_seen.add(series_id)
                  world_seen.add(series['world_id'])
                  pose_seen.add(rec['axes']['pose_id'])
                  style_series_seen[series['style_id']] = style_series_seen.get(series['style_id'], 0) + 1
                  method = rec['axes']['video_method']
                  video_methods[method] = video_methods.get(method, 0) + 1
                  if method == 'V-02':
                      assert len(rec['video_keyframes']) == 5
                      keyframes = rec['video_keyframes']
                      master = next(frame for frame in keyframes if frame['keyframe_id'] == 'KF3')
                      assert master['is_h2_master'] is True
                      assert master['generation_order'] == 1
                      assert master['contact_state'] == 'H2'
                      assert master['status'] == 'MID_CORRECTION_REQUIRED'
                      assert all(frame['parent_keyframe_id'] == 'KF3' and frame['status'] == 'BLOCKED_UNTIL_KF3_H2_ACCEPTED' for frame in keyframes if frame['keyframe_id'] != 'KF3')
                      assert len({frame['text_content_sha256'] for frame in keyframes}) == 1
                      assert {frame['typography_variant'] for frame in keyframes} == {'before', 'middle', 'after'}
                      assert all('do not generate this frame independently' in frame['prompt'].lower() for frame in keyframes if frame['keyframe_id'] != 'KF3')
                  else:
                      assert len(rec['video_keyframes']) == 0
                  if method == 'V-09':
                      assert len(rec['mv_shots']) == series['mv_shots_if_v09']
                  else:
                      assert len(rec['mv_shots']) == 0
          assert package_count == 389664, package_count
          assert len(id_seen) == 389664
          assert len(series_seen) == 18 and len(world_seen) == 18 and pose_seen == {'P01', 'P02', 'P03', 'P04'}
          assert set(style_series_seen) == {'S01', 'S02', 'S03'}
          print(f"Verified {package_count:,} unique legal geometry × camera/action × four poses × compatible video × style/world/character series combinations; V-02 only expands from H2 master rows.")
          print(f"Generated {s['compiled_base_image_and_video_prompt_count'] + s['video_keyframe_prompts_compiled'] + s['mv_shot_image_and_video_prompt_count']:,} complete prompt strings; no media generation or audit PASS claimed.")
          PY
      - name: Prepare compact full-product receipt without storing the multi-million-prompt payload
        run: |
          python - <<'PY'
          import gzip
          import json
          import shutil
          from pathlib import Path

          root = Path('out/prompt_evidence_board/boundary_pedestrian/product_matrix')
          receipt = Path('out/prompt_evidence_board/boundary_pedestrian/product_matrix_receipt')
          receipt.mkdir(parents=True, exist_ok=True)
          summary = json.loads((root / 'boundary_walker_product_summary.json').read_text(encoding='utf-8'))
          with gzip.open(root / 'boundary_walker_full_product.jsonl.gz', 'rt', encoding='utf-8') as src:
              with gzip.open(receipt / 'first_32_full_prompt_packages.jsonl.gz', 'wt', encoding='utf-8') as dst:
                  for i, line in enumerate(src):
                      if i >= 32:
                          break
                      dst.write(line)
          summary['full_product_verified_in_ci'] = True
          summary['full_prompt_bundle_retained_in_artifact'] = False
          summary['output_packages_gzip'] = 'NOT_RETAINED_IN_ARTIFACT; regenerate with boundary_pedestrian_product_matrix.py'
          summary['output_index_csv'] = 'NOT_RETAINED_IN_ARTIFACT; regenerate with boundary_pedestrian_product_matrix.py'
          summary['artifact_sample_jsonl_gzip'] = str(receipt / 'first_32_full_prompt_packages.jsonl.gz')
          summary['artifact_note'] = 'CI verified the complete 389,664-combination product in the runner; this artifact retains a 32-row full-prompt sample plus counts/series inventory to avoid Actions storage quota exhaustion. Re-run boundary_pedestrian_product_matrix.py to reproduce the complete JSONL.GZ.'
          (receipt / 'full_product_verification_receipt.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          shutil.rmtree(root)
          shutil.rmtree(Path('out/prompt_evidence_board/boundary_pedestrian/loop_prompts'), ignore_errors=True)
          print('Full product was verified; the uploaded artifact retains a 32-combination prompt sample and complete summary only.')
          PY
      - name: Render standard and formula-first teaching board templates
        run: |
          python bubble_break/prompt_evidence_board.py \
            --manifest examples/prompt_attempt_manifest.example.json \
            --teaching-layout standard \
            --out out/prompt_evidence_board/template.svg
          python bubble_break/prompt_evidence_board.py \
            --manifest examples/prompt_attempt_manifest.example.json \
            --teaching-layout formula-first \
            --out out/prompt_evidence_board/template_formula_first.svg
      - name: Create the next image/teaching/video trial plan
        run: |
          python bubble_break/prompt_trial_planner.py \
            --outdir out/prompt_evidence_board/next_trials \
            --limit 3
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('out/prompt_evidence_board/next_trials/trial_plan.json').read_text(encoding='utf-8'))
          assert plan['plan_status'] == 'PLAN_READY'
          assert [t['trial_id'] for t in plan['next_trials']] == ['IMG-FORMULA-01', 'IMG-TEACH-01', 'VIDEO-FORMULA-01']
          assert {t['family'] for t in plan['next_trials']} == {'image_formula', 'image_teaching', 'video_formula'}
          assert plan['plan_only'] is True and plan['external_generation_called'] is False
          print('Preregistered trial plan covers image formula, image teaching-board layout, and video prompt formula; generation not claimed.')
          PY
      - name: Compile a traceable prompt-packet example
        run: |
          python bubble_break/prompt_attempt_packet.py \
            --matrix examples/prompt_matrix_minimal.example.json \
            --outdir out/prompt_evidence_board/demo_packets \
            --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --commit-sha "${GITHUB_SHA}"
      - name: Compile the full 192-variant T-Hammer matrix and per-prompt packets
        run: |
          python bubble_break/t_hammer_multiview_swing_engine.py --outdir out/prompt_evidence_board/t_hammer_matrix
          python bubble_break/prompt_attempt_packet.py \
            --matrix out/prompt_evidence_board/t_hammer_matrix/t_hammer_multiview_swing_matrix.json \
            --outdir out/prompt_evidence_board/t_hammer_packets \
            --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --commit-sha "${GITHUB_SHA}"
      - name: Verify previews cannot claim an image PASS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('out/prompt_evidence_board/template.svg')
          s = p.read_text(encoding='utf-8')
          assert 'NO SOURCE RASTER ATTACHED' in s
          assert 'NOT_RUN' in s
          assert 'FORMULA ≠ PIXEL PROOF' in s
          assert 'PLANNER REQUIRED' in s
          assert 'NEXT TRIAL' in s
          assert 'prompt_trial_planner.py' in s
          f = Path('out/prompt_evidence_board/template_formula_first.svg').read_text(encoding='utf-8')
          assert 'FORMULA / 公式拆解' in f
          assert 'OUTPUT CONTRACT' in f
          index = __import__('json').loads(Path('out/prompt_evidence_board/demo_packets/prompt_attempt_index.json').read_text(encoding='utf-8'))
          assert index['attempt_count'] == 2
          assert index['image_realization'] == 'NOT_RUN'
          assert index['pixel_audit'] == 'NOT_RUN'
          assert all(x['pixel_audit_status'] == 'NOT_RUN' for x in index['attempts'])
          full_index = __import__('json').loads(Path('out/prompt_evidence_board/t_hammer_packets/prompt_attempt_index.json').read_text(encoding='utf-8'))
          assert full_index['variant_count'] == 192
          assert full_index['attempt_count'] == 768
