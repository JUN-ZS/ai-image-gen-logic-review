name: R10.1 clean verify from Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  TAG: r10-1-atomic-closed-loop

jobs:
  clean-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install opencv-python-headless numpy

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'run_r10_1.py' \
            --pattern 'verify_r10_1.py' \
            --pattern 'INPUTS_R10_1.tar.gz' \
            --pattern 'ACCEPT_R10_1.json'
          mkdir -p inputs complete roi preview
          tar -xzf INPUTS_R10_1.tar.gz -C inputs
          cp ACCEPT_R10_1.json ACCEPT_R10_1_FROM_RELEASE.json
          echo "inputs:"; ls -la inputs | head

      - name: Run runner
        working-directory: work
        run: python3 -u run_r10_1.py | tee CLEAN_RUN.log

      - name: Verify + PNG determinism
        working-directory: work
        run: |
          python3 verify_r10_1.py . | tee VERIFY_PASS.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          acc=json.loads(Path('ACCEPT_R10_1.json').read_text())
          rel=json.loads(Path('ACCEPT_R10_1_FROM_RELEASE.json').read_text())
          assert acc['runner']['sha256']==rel['runner']['sha256'], 'runner sha drift'
          n=0
          for j in acc['jobs']:
            if j['status']!='OK': continue
            rj=next(x for x in rel['jobs'] if x.get('tag')==j['tag'] and x.get('method')==j['method'])
            assert j['sha256']==rj['sha256'], (j['tag'], j['method'], j['sha256'], rj['sha256'])
            n+=1
          print(f'PNG_DETERMINISM_PASS {n}')
          assert n>=10
          PY

      - name: Write CI report
        working-directory: work
        run: |
          {
            echo "# R10.1 CLEAN CHECKOUT VERIFY (GitHub Actions)"
            echo
            echo "- repo: ${{ github.repository }}"
            echo "- ref: ${{ github.sha }}"
            echo "- run_id: ${{ github.run_id }}"
            echo "- run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- tag: $TAG"
            echo
            echo '## VERIFY'
            cat VERIFY_PASS.log
            echo
            echo '## PNG_DETERMINISM'
            echo 'runner_sha + all OK job PNG shas matched release ACCEPT'
            echo
            echo '## RUN TAIL'
            tail -40 CLEAN_RUN.log
          } > VERIFY_CI_PASS.md
          # GHA-specific name so we don't clobber local sandbox log name semantics
          cp VERIFY_CI_PASS.md VERIFY_CI_PASS_GHA.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r10-1-clean-verify
          path: |
            work/VERIFY_CI_PASS.md
            work/VERIFY_CI_PASS_GHA.md
            work/VERIFY_PASS.log
            work/CLEAN_RUN.log
            work/ACCEPT_R10_1.json
            work/complete/MANIFEST_SHA256_R10_1.json

      - name: Attach logs to Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: work
        run: |
          # Upload with GHA-suffixed names to preserve local clean log on release
          gh release upload "$TAG" \
            VERIFY_CI_PASS_GHA.md \
            VERIFY_PASS.log#VERIFY_PASS_GHA.log \
            CLEAN_RUN.log#CLEAN_RUN_GHA.log \
            --repo "${{ github.repository }}" --clobber
